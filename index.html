<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 LoL 미니게임 아레나</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #091428;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(200, 170, 110, 0.08) 0%, transparent 45%);
      color: #f0e6d2;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 메인 타이틀 & 헤더 */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title-badge {
      display: inline-block;
      padding: 5px 16px;
      font-size: 13px;
      font-weight: bold;
      color: #00d2ff;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
    }

    h1 {
      color: #c8aa6e;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(200, 170, 110, 0.5);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a09b8c;
      font-size: 16px;
    }

    /* 게임 카드 그리드 */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      width: 100%;
      max-width: 860px;
    }

    /* 게임 카드 스타일 */
    .game-card {
      position: relative;
      background: linear-gradient(180deg, #1e282d 0%, #0a141e 100%);
      border: 2px solid #785a28;
      border-radius: 12px;
      padding: 30px 26px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 240px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #c8aa6e, #00d2ff);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: #c8aa6e;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(200, 170, 110, 0.3);
    }

    .game-card:hover::before {
      opacity: 1;
    }

    /* 카드 상단 */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .game-icon {
      font-size: 38px;
    }

    .game-tag {
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-react {
      background: rgba(232, 64, 87, 0.2);
      color: #ff6b81;
      border: 1px solid rgba(232, 64, 87, 0.4);
    }

    .tag-aim {
      background: rgba(0, 210, 255, 0.2);
      color: #00d2ff;
      border: 1px solid rgba(0, 210, 255, 0.4);
    }

    /* 카드 텍스트 */
    .game-title {
      font-size: 22px;
      font-weight: bold;
      color: #f0e6d2;
      margin-bottom: 10px;
      transition: color 0.2s;
    }

    .game-card:hover .game-title {
      color: #00d2ff;
    }

    .game-desc {
      font-size: 14px;
      color: #a09b8c;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* 플레이 버튼 UI */
    .play-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #c8aa6e;
      background: rgba(200, 170, 110, 0.1);
      border: 1px solid rgba(200, 170, 110, 0.3);
      padding: 8px 18px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .game-card:hover .play-btn {
      background: #c8aa6e;
      color: #091428;
    }

    /* 푸터 */
    .footer {
      margin-top: 45px;
      font-size: 13px;
      color: #5c5b57;
      text-align: center;
    }

    /* 모바일 반응형 */
    @media (max-width: 768px) {
      .game-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-badge">LOL MINI GAME ARENA</div>
    <h1>🎮 나의 롤 미니게임 놀이터</h1>
    <p class="subtitle">반응속도와 예측 에임을 시험해 보세요!</p>
  </div>

  <div class="game-grid">
    
    <!-- 1. 말파 궁 피하기 -->
    <a href="./Flash_or_Die_code.html" class="game-card">
      <div>
        <div class="card-top">
          <div class="game-icon">🪨</div>
          <span class="game-tag tag-react">반응속도 훈련</span>
        </div>
        <div class="game-title">바위로 계란 치기</div>
        <p class="game-desc">
          말파이트의 멈출 수 없는 힘(R)을 점멸로 피하세요!<br>
          마공벨트와 점멸 훼이크 심리전에 낚이지 마세요.
        </p>
      </div>
      <div class="play-btn">플레이 하기 ➔</div>
    </a>

    <!-- 2. 제라스 궁 저격 -->
    <a href="./Are You Hitscan.html" class="game-card">
      <div>
        <div class="card-top">
          <div class="game-icon">⚡</div>
          <span class="game-tag tag-aim">예측 에임 훈련</span>
        </div>
        <div class="game-title">Are You Hitscan?</div>
        <p class="game-desc">
          화려하게 도망치는 상대를 비전 폭격으로 저격하세요!<br>
          0.55초 탄속 딜레이와 연사 제한을 계산해 맞춰야 합니다.
        </p>
      </div>
      <div class="play-btn">플레이 하기 ➔</div>
    </a>

  </div>

  <div class="footer">
    키보드 & 마우스로 즐기는 LoL 브라우저 미니게임
  </div>

</body>
</html>
